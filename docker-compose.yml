services:
  postgres:
    image: postgres:16-alpine
    container_name: neurorecrut-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neurorecrut
      POSTGRES_PASSWORD: neurorecrut
      POSTGRES_DB: neurorecrut
    ports:
      - "5432:5432"
    volumes:
      - neurorecrut_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurorecrut -d neurorecrut"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neurorecrut_postgres_data:
